spring.application.name=file-processor-service
server.port=8080

# Database configuration for billing records
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/billingdb}
spring.datasource.username=${DB_USERNAME:billingapp}
spring.datasource.password=${DB_PASSWORD:billingpass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway migration configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# AWS S3 LocalStack Configuration
# Values can be overridden by Kubernetes env vars (ConfigMap / Secret).
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localstack.cloud-native-app:4566}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:processor-bucket}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:test}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:test}

# Actuator & Monitoring
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
