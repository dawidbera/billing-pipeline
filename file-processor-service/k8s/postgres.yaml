# Purpose: Kubernetes Deployment and Service for PostgreSQL database.
# Provides persistence for billing records and processing jobs in cloud-native-app namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cloud-native-app
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: billingdb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: file-processor-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: file-processor-secret
                  key: DB_PASSWORD
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cloud-native-app
  labels:
    app: postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres
