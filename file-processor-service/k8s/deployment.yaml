apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-processor
  namespace: cloud-native-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-processor
  template:
    metadata:
      labels:
        app: file-processor
    spec:
      containers:
      - name: file-processor
        image: ghcr.io/dawidbera/billing-pipeline/file-processor:603adeb19ab56bfbe2a95790af3cca215aa4052b
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        env:
          - name: AWS_S3_ENDPOINT
            valueFrom:
              configMapKeyRef:
                name: file-processor-config
                key: AWS_S3_ENDPOINT
          - name: AWS_S3_REGION
            valueFrom:
              configMapKeyRef:
                name: file-processor-config
                key: AWS_S3_REGION
          - name: AWS_S3_BUCKET
            valueFrom:
              configMapKeyRef:
                name: file-processor-config
                key: AWS_S3_BUCKET
          - name: AWS_S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: file-processor-secret
                key: AWS_S3_ACCESS_KEY
          - name: AWS_S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: file-processor-secret
                key: AWS_S3_SECRET_KEY
          - name: DB_URL
            valueFrom:
              configMapKeyRef:
                name: file-processor-config
                key: DB_URL
          - name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: file-processor-secret
                key: DB_USERNAME
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: file-processor-secret
                key: DB_PASSWORD
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
