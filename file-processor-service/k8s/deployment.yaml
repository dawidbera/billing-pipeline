apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-processor
  namespace: cloud-native-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-processor
  template:
    metadata:
      labels:
        app: file-processor
    spec:
      containers:
      - name: file-processor
        image: file-processor:latest
        imagePullPolicy: Never
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        env:
          - name: AWS_S3_ENDPOINT
            valueFrom:
              configMapKeyRef:
                name: file-processor-config
                key: AWS_S3_ENDPOINT
          - name: AWS_S3_REGION
            valueFrom:
              configMapKeyRef:
                name: file-processor-config
                key: AWS_S3_REGION
          - name: AWS_S3_BUCKET
            valueFrom:
              configMapKeyRef:
                name: file-processor-config
                key: AWS_S3_BUCKET
          - name: AWS_S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: file-processor-secret
                key: AWS_S3_ACCESS_KEY
          - name: AWS_S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: file-processor-secret
                key: AWS_S3_SECRET_KEY
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
