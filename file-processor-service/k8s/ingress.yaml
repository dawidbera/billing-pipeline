# Purpose: Kubernetes Ingress routing external HTTP traffic to File Processor service.
# Uses Traefik ingress controller on k3s for file-processor.localhost domain.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: file-processor-ingress
  namespace: cloud-native-app
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: file-processor.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: file-processor-service
                port:
                  number: 80
