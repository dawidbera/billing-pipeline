# Purpose: Kubernetes Secret holding AWS / LocalStack credentials for File Processor Service.
# Emulated S3 credentials for local development in cloud-native-app namespace.
apiVersion: v1
kind: Secret
metadata:
  name: file-processor-secret
  namespace: cloud-native-app
  labels:
    app: file-processor
type: Opaque
stringData:
  AWS_S3_ACCESS_KEY: "test"
  AWS_S3_SECRET_KEY: "test"
